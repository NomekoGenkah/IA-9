version: '3.8'

# Self-contained static frontend — all computation runs in the browser. This
# compose file is only for local dev convenience; production is served as static
# files on GitHub Pages (see .github/workflows/deploy.yml).

services:
  frontend:
    build: ./frontend
    container_name: ia9-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
